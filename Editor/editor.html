<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hotspot Editor</title>

<link rel="stylesheet" href="style.css">

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

</head>

<body>

<div id="app">

<div id="sidebarContainer">

<div id="viewport">

<button id="toggleSidebarBtn" title="Toggle Sidebar">
&#9776;
</button>

<div id="gizmoToolbar">
  <div class="gizmo-btn-group">
    <button id="gizmoTranslateBtn" class="gizmo-btn active" title="Translate Mode (G / W)">&#10021; Move</button>
    <button id="gizmoRotateBtn" class="gizmo-btn" title="Rotate Mode (R / E)">&#8635; Rotate</button>
    <button id="gizmoScaleBtn" class="gizmo-btn" title="Scale Mode (S)">&#8690; Scale</button>
  </div>
  <div class="gizmo-divider"></div>
  <div class="gizmo-btn-group">
    <button id="gizmoSpaceBtn" class="gizmo-btn" title="Toggle World / Local Space">WORLD</button>
    <button id="gizmoSnapBtn" class="gizmo-btn" title="Toggle Snapping (0.25m / 15°)">SNAP</button>
    <button id="gizmoHideBtn" class="gizmo-btn" title="Toggle Gizmo Visibility (X)">GIZMO</button>
  </div>
</div>

<div id="overlay">
<svg id="hotspotLines"></svg>
</div>

</div>

<div id="sidebar">

<div class="sidebar-tabs">
<button
id="sceneTabBtn"
class="sidebar-tab active"
type="button"
data-tab="scene"
>
Hierarchy &amp; Scene
</button>

<button
id="propertiesTabBtn"
class="sidebar-tab"
type="button"
data-tab="properties"
>
Inspector
</button>
</div>

<div
id="sceneTab"
class="sidebar-tab-panel active"
>

<div class="section hierarchy-section">
  <div class="section-header">
    <h3>Scene Hierarchy</h3>
    <span class="hierarchy-badge">Outliner</span>
  </div>
  
  <div class="hierarchy-search-bar">
    <input id="hierarchySearchInput" type="text" placeholder="Filter objects in scene...">
  </div>

  <div id="sceneHierarchyTree" class="hierarchy-tree-container">
    <!-- Rendered dynamically by hierarchy.js -->
  </div>
</div>

<div class="section">
<h3>Quick Create</h3>
<div class="button-grid">
  <button id="addBtn" class="primary-btn">
    Add Hotspot
  </button>
  <button id="addDirectionalLightBtn" class="secondary">
    &#10133; Directional Light
  </button>
</div>
</div>

<div class="section">
<h3>Model Import</h3>
<input id="modelInput" type="file" accept=".glb">
</div>

<div class="section">
<h3>JSON Annotations</h3>

<button id="importJsonBtn" class="secondary">
Import JSON
</button>

<input
id="jsonInput"
type="file"
accept=".json"
style="display:none"
>

<button id="exportBtn">
Export JSON
</button>

</div>

<div class="section">

<h3>Scene Environment</h3>

<div class="param-row-flex">
  <label>Background Color</label>
  <input
  id="backgroundColor"
  type="color"
  value="#3f3f3f">
</div>

</div>

</div>

<div
id="propertiesTab"
class="sidebar-tab-panel"
>
  <!-- Rendered dynamically by inspector.js -->
</div>

</div>

</div>

<script type="module" src="editor.js"></script>

</body>
</html>
