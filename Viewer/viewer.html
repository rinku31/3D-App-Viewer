<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Hotspot Viewer</title>

<link rel="apple-touch-icon" sizes="180x180" href="../favicon/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="../favicon/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../favicon/favicon-16x16.png">
<link rel="manifest" href="../favicon/site.webmanifest">

<link rel="stylesheet" href="style.css">

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

</head>

<body>

<div id="viewport"></div>

<header id="viewerHeader">
  <div class="header-left">
    <a href="../index.html" class="header-btn home-btn" title="Back to Hub">
      <span>&#8592;</span> Hub
    </a>
    <div class="header-divider"></div>
    <img src="../Logo.png" alt="3D App Logo" style="height: 24px; margin-right: 8px; border-radius: 4px; vertical-align: middle;">
    <span class="viewer-brand">Presentation Viewer</span>
    <div class="header-divider"></div>
    <label for="modelInput" class="header-btn" title="Upload custom 3D model (.glb)">
      &#128230; Load Model
    </label>
    <input id="modelInput" type="file" accept=".glb,.gltf,.json" multiple style="display:none">
  </div>
</header>

<div id="overlay">
  <svg id="svg"></svg>
</div>

<script type="module" src="viewer.js"></script>

</body>
</html>
